const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const chance=p=>Math.random()<p;
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}

const LEET={a:'4',e:'3',i:'1',o:'0',s:'5',t:'7',l:'1',g:'9'};
function corrupt(str,lvl){
  lvl=lvl||0;
  if(lvl<=0)return str;
  let out='';
  for(const ch of str){
    const c=ch.toLowerCase();
    if(ch!==' '&&LEET[c]!==undefined&&Math.random()<lvl*0.6)out+=LEET[c];
    else if(ch!==' '&&Math.random()<lvl*0.045)out+='\u2588';
    else out+=ch;
  }
  return out;
}

const Aud={
  ctx:null, master:null, started:false,

      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

      this.brown=bb;
      const dg=this.droneG=c.createGain();dg.gain.value=0.10;dg.connect(m);
      const o1=this.o1=c.createOscillator();o1.type='sine';o1.frequency.value=41.2;
      const o2=this.o2=c.createOscillator();o2.type='sine';o2.frequency.value=54.6;

      const g3=c.createGain();g3.gain.value=0.5;o3.connect(g3);g3.connect(dg);
      o1.connect(dg);o2.connect(dg);o1.start();o2.start();o3.start();
      const lfo=c.createOscillator();lfo.frequency.value=0.05;
      const lg=c.createGain();lg.gain.value=0.045;lfo.connect(lg);lg.connect(dg.gain);lfo.start();
      const rs=c.createBufferSource();rs.buffer=this.brown;rs.loop=true;
      const rf=c.createBiquadFilter();rf.type='lowpass';rf.frequency.value=300;
      const rg=this.roomG=c.createGain();rg.gain.value=0.035;
      rs.connect(rf);rf.connect(rg);rg.connect(m);rs.start();
      const bs=c.createBufferSource();bs.buffer=this.noise;bs.loop=true;

      const bg=this.breathG=c.createGain();bg.gain.value=0;
      const blfo=c.createOscillator();blfo.frequency.value=0.28;
      const blg=this.breathLg=c.createGain();blg.gain.value=0;
      blfo.connect(blg);blg.connect(bg.gain);
      bs.connect(bf);bf.connect(bg);bg.connect(m);bs.start();blfo.start();
      const ho=this.humOsc=c.createOscillator();ho.type='triangle';ho.frequency.value=100;
      const hg=this.humG=c.createGain();hg.gain.value=0;
      const hp=this.humPan=c.createStereoPanner?c.createStereoPanner():null;
      ho.connect(hg);

      ho.start();
      this.started=true;
      Meta.log('audio synthesized. no files were harmed.');
    }catch(e){}
  },
  pan(node,p){if(node&&this.ctx.createStereoPanner){const sp=this.ctx.createStereoPanner();sp.pan.value=clamp(p,-1,1);node.connect(sp);sp.connect(this.master);}else node.connect(this.master);},
  thump(vol,when){
    const c=this.ctx,t=(when||c.currentTime);

    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+0.2);
  },
  step(vol,pan){
    if(!this.started)return;vol=vol===undefined?1:vol;
    const c=this.ctx,t=c.currentTime;
    const s=c.createBufferSource();s.buffer=this.noise;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=rnd(340,520);
    const g=c.createGain();
    g.gain.setValueAtTime(0.09*vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    s.connect(f);f.connect(g);this.pan(g,pan||0);
    s.start(t,rnd(0,1.5));s.stop(t+0.12);
  },
  whisper(pan,vol,dur){
    if(!this.started)return;
    const c=this.ctx,t0=c.currentTime;vol=vol||1;dur=dur||2.5;
    const s=c.createBufferSource();s.buffer=this.noise;s.loop=true;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=rnd(1100,2900);f.Q.value=1.4;
    const g=c.createGain();g.gain.value=0;
    s.connect(f);f.connect(g);
    let tail=g;
    if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);tail=p;}
    tail.connect(this.master);
    let t=t0+0.05;
    while(t<t0+dur){
      const seg=rnd(0.07,0.26),gap=rnd(0.03,0.16);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.002,0.05*vol*rnd(0.5,1.3)),t+seg*0.4);
      g.gain.exponentialRampToValueAtTime(0.0001,t+seg);
      t+=seg+gap;
    }
    s.start(t0,rnd(0,1));s.stop(t0+dur+0.2);
  },
  stinger(){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const s=c.createBufferSource();s.buffer=this.noise;
    const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.6;
    f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(280,t+0.45);
    const g=c.createGain();g.gain.setValueAtTime(0.26,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+0.6);
    const o=c.createOscillator(),og=c.createGain();
    o.type='sine';o.frequency.value=1900;
    og.gain.setValueAtTime(0.09,t);og.gain.exponentialRampToValueAtTime(0.0001,t+1.3);
    o.connect(og);og.connect(this.master);o.start(t);o.stop(t+1.4);
  },
  blip(f0,f1,vol){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(f0||740,t);o.frequency.exponentialRampToValueAtTime(f1||330,t+0.13);
    g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+0.2);
  },
  chime(pan,vol){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(1080,t);o.frequency.exponentialRampToValueAtTime(870,t+0.3);
    g.gain.setValueAtTime(vol||0.03,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    o.connect(g);this.pan(g,pan);o.start(t);o.stop(t+0.4);
  },
  crtOff(){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(9000,t);o.frequency.exponentialRampToValueAtTime(45,t+0.35);
    g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+0.45);
    const s=c.createBufferSource();s.buffer=this.noise;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=900;
    const ng=c.createGain();ng.gain.setValueAtTime(0.16,t);ng.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    s.connect(f);f.connect(ng);ng.connect(this.master);s.start(t);s.stop(t+0.1);
  },
  doorVanish(){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const s=c.createBufferSource();s.buffer=this.noise;
    const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=2;

  },
  click(){
    if(!this.started)return;

    const s=c.createBufferSource();s.buffer=this.noise;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2000;
    const g=c.createGain();g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.03);

  setSilence(on){this.silT=on?0.0001:0.9;},
  duck(a,d){

  endToRoomtone(){

  tick(dt){
    if(!this.started)return;
    const t=this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.silT,t,0.55);
    if(this.hbOn&&!S.silence){

        this.hbNext=interval;
        const v=clamp(lerp(0.03,0.4,Math.max(0,low-0.22)*1.4),0.03,0.4);
        this.thump(v,t+0.01);this.thump(v*0.72,t+0.01+interval*0.17);

    const br=clamp((35-S.coh)/35,0,1);

    }else this.humG.gain.setTargetAtTime(0,t,0.2);
  }
};
const R={
  zbuf:new Float32Array(W), tops:new Float32Array(W), bots:new Float32Array(W),
  cid:new Int32Array(W), side:new Uint8Array(W), vig:null,
  init(){

    const g=v.getContext('2d');
    const gr=g.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,H*0.8);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.62)');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
    this.vig=v;
  },
  cast(rx,ry,rdx,rdy){
    let mx=Math.floor(rx),my=Math.floor(ry);
    const ddx=Math.abs(1/(rdx||1e-9)),ddy=Math.abs(1/(rdy||1e-9));
    let sx,sy,sdx,sdy,side=0;
    if(rdx<0){sx=-1;sdx=(rx-mx)*ddx;}else{sx=1;sdx=(mx+1-rx)*ddx;}
    if(rdy<0){sy=-1;sdy=(ry-my)*ddy;}else{sy=1;sdy=(my+1-ry)*ddy;}
    for(let i=0;i<96;i++){
      let d;
      if(sdx<sdy){d=sdx;sdx+=ddx;mx+=sx;side=0;}
      else{d=sdy;sdy+=ddy;my+=sy;side=1;}
      if(d>MAXD)return null;
      const cell=World.cellAt(mx,my);
      if(cell==='#'||cell==='?')
        return{dist:d,side:side,mx:mx,my:my,cell:cell,hx:rx+rdx*d,hy:ry+rdy*d};
    }
    return null;
  },
  frame(){
    const dirX=S.dx,dirY=S.dy,plX=-dirY*0.66,plY=dirX*0.66;
    cx.fillStyle='#000000';cx.fillRect(0,0,W,H);
    const fg=cx.createLinearGradient(0,H*0.52,0,H);
    fg.addColorStop(0,'#000000');fg.addColorStop(0.4,'#020202');fg.addColorStop(1,'#0a0a0a');
    cx.fillStyle=fg;cx.fillRect(0,H/2,W,H/2);
    const lamps=World.lamps;
    const wob=S.wobble;
    for(let x=0;x<W;x++){
      const cam=2*x/W-1;
      const rdx=dirX+plX*cam, rdy=dirY+plY*cam;
      const h=this.cast(S.px,S.py,rdx,rdy);
      if(!h||h.cell==='?'){this.zbuf[x]=1e9;this.tops[x]=-1;this.cid[x]=-1;continue;}
      const d=h.dist;
      this.zbuf[x]=d;
      const lh=H/d;
      let top=H/2-lh/2+S.bob, bot=H/2+lh/2+S.bob;
      if(wob>0){top+=Math.sin(S.t*0.9+x*0.045)*wob;bot+=Math.sin(S.t*1.33+x*0.031)*wob*0.6;}
      this.tops[x]=top;this.bots[x]=bot;this.cid[x]=h.mx*8192+h.my;this.side[x]=h.side;
      let br=clamp(1-d/MAXD,0,1);
      let base=3+br*26*(h.side?0.72:1);
      let r=base,g=base,b=base;
      for(let i=0;i<lamps.length;i++){
        const L=lamps[i];if(L.cur<=0)continue;
        const ddx=h.hx-L.x,ddy=h.hy-L.y,dd=ddx*ddx+ddy*ddy;
        if(dd<22){const lb=Math.min(44,(1-dd/22)*L.cur*34);g+=lb;r+=lb*0.5;b+=lb*0.35;}
      }
      if(S.lightOn&&!S.lightDead&&S.charge>0){
        const f=(1-Math.abs(cam)*1.55)*clamp(1-d/6.5,0,1)*S.lightCur;
        if(f>0){const fb=f*30;g+=fb;r+=fb*0.85;b+=fb*0.65;}
      }
      cx.fillStyle='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
      cx.fillRect(x,top|0,1,Math.max(1,(bot-top)|0));
    }
    cx.strokeStyle='rgba(108,146,108,0.34)';cx.lineWidth=1;cx.beginPath();
    for(let x=0;x<W;x++){
      const t=this.tops[x];
      if(t<0)continue;
      const b=this.bots[x],prev=x>0&&this.tops[x-1]>=0;
      if(!prev){cx.moveTo(x+0.5,t);cx.lineTo(x+0.5,b);continue;}
      if(this.cid[x]!==this.cid[x-1]){
        cx.moveTo(x-0.5,Math.min(this.tops[x-1],t));
        cx.lineTo(x-0.5,Math.max(this.bots[x-1],b));
      }
      cx.moveTo(x-0.5,this.tops[x-1]);cx.lineTo(x+0.5,t);
      cx.moveTo(x-0.5,this.bots[x-1]);cx.lineTo(x+0.5,b);
    }
    cx.stroke();
    let nearSign=null,nsd=1e9;
    for(const e of World.ents)if(e.type==='sign'&&!e.gone){const dd=dist2(e.x,e.y,S.px,S.py);if(dd<nsd){nsd=dd;nearSign=e;}}
    for(const e of World.ents)if(e.type==='sign')e._near=(e===nearSign);
    const list=[];
    for(const e of World.ents){
      if(e.gone||e.hidden)continue;
      const ty=this.depth(e.x,e.y);
      if(ty!==null)list.push({ty:ty,e:e});
    }
    for(const gh of World.ghosts){const ty=this.depth(gh.x,gh.y);if(ty!==null)list.push({ty:ty-0.01,e:gh,ghost:true});}
    if(Obs.active&&!Obs.hidden){const ty=this.depth(Obs.x,Obs.y);if(ty!==null)list.push({ty:ty,e:Obs,obs:true});}
    list.sort((a,b)=>b.ty-a.ty);
    for(const it of list){
      if(it.ghost)this.drawGhost(it.e,it.ty);
      else if(it.obs)this.drawObs(it.ty);
      else this.drawEnt(it.e,it.ty);
    }
    this.post();
  },
  scr(wx,wy){
    const dirX=S.dx,dirY=S.dy,plX=-dirY*0.66,plY=dirX*0.66;
    const rx=wx-S.px,ry=wy-S.py;
    const inv=1/(plX*dirY-dirX*plY);
    const tx=inv*(dirY*rx-dirX*ry);
    const ty=inv*(-plY*rx+plX*ry);
    if(ty<=0.1)return null;
    return{x:(W/2)*(1+tx/ty),ty:ty,sc:H/ty};
  },
  depth(wx,wy){

  },
  zb(x,ty){if(x<0||x>=W)return false;return this.zbuf[x|0]>ty;},
  figure(sx,base,hgt,alpha,dis){
    cx.save();

    for(let i=0;i<n;i++){
      const fx=sx-w/2+w*i/(n-1);
      const j=Math.sin(S.t*11+i*2.3)*hgt*0.013+Math.sin(S.t*3.1+i*0.7)*hgt*0.007;
      const taper=Math.sin(Math.PI*i/(n-1));
      let y0=base-hgt*(0.86+0.14*taper);
      if(dis>0)y0=Math.max(y0,base-hgt+dis*hgt*(0.75+0.45*Math.abs(Math.sin(i*1.71+S.t*2))));
      const y1=base-hgt*0.02;
      if(y1-y0<1)continue;

      cx.beginPath();cx.moveTo(fx+j,y0);cx.lineTo(fx-j*0.7,y1);cx.stroke();

  drawObs(ty){

  update(dt){
    for(let i=this.timers.length-1;i>=0;i--)if(S.t>=this.timers[i].at){const f=this.timers[i].fn;this.timers.splice(i,1);f();}
    for(let i=this.ghosts.length-1;i>=0;i--){this.ghosts[i].ttl-=dt;if(this.ghosts[i].ttl<=0)this.ghosts.splice(i,1);}
    this.termScroll=(this.termScroll+dt*3)%Math.max(1,this.termCode.length);
    for(const L of this.lamps){
      L.cur=L.on?(0.8+0.2*Math.sin(S.t*7+L.ph)+rnd(-0.06,0.06)):0;
      if(S.corruptAll>0&&chance(0.06))L.cur*=0.3;
      if(S.quietHour&&chance(0.01))L.cur*=0.4;
      L.cur=clamp(L.cur,0,1);
    }
    this.movement(dt);
    this.interactScan();
    this.coherence(dt);
    this.acts(dt);
    Obs.tick(dt);
    this.whT-=dt*(1.7-S.coh/100)*(S.quietHour?1.6:1);
    if(this.whT<=0){
      this.whT=rnd(18,40);
      const v=lerp(0.4,1.3,1-S.coh/100);
      Aud.whisper(rnd(-0.9,0.9),v*(S.quietHour?1.5:1),rnd(2,3.6));
      if(chance(0.4)&&S.coh<62)Msg.say('[wh1spers] '+corrupt(nm(),0.55)+'...',2.8,true);
    }
    if(S.coh<40&&S.actNo<3){
      this.stepFT-=dt;
      if(this.stepFT<=0){
        this.stepFT=rnd(24,50);
        Aud.step(0.55,rnd(0.7,1)*(chance(0.5)?1:-1));
        if(chance(0.5))Msg.say('[steps behind y0u]',2.2,true);
      }
    }
    if(S.actNo>=2&&!S.pauseOpen){
      this.fsT-=dt;
      if(this.fsT<=0){
        this.fsT=rnd(45,85);
        Msg.say('game saved.',1.8,true);
        Aud.blip(520,260,0.04);
        if(chance(0.5))Save.write();
      }
    }
    this.qhT-=dt;
    if(this.qhT<=0){
      this.qhT=20;
      const was=S.quietHour;
      S.quietHour=(new Date().getHours()===3);
      if(S.quietHour&&!was&&inGame()){
        Msg.say('the quiet h0ur.',3.6);
        World.after(3.4,()=>Msg.say('s0mething unl0cks.',3));
        this.spawnQuiet();
      }
    }
    this.flashCd-=dt;
    if(this.flashCd<=0&&inGame()&&S.actNo>=1&&S.coh<55){
      this.flashCd=rnd(200,320);
      S.flash={kind:chance(0.5)?'behind':'sil',frames:chance(0.3)?2:1};
      Aud.click();
      if(chance(0.4))Meta.title("d0n't turn ar0und");
    }
  },
  movement(dt){
    if(S.pauseOpen||S.read||S.term)return;
    let f=0,s=0;
    if(Keys.KeyW||Keys.ArrowUp)f+=1;
    if(Keys.KeyS||Keys.ArrowDown)f-=1;
    if(Keys.KeyA)s-=1;
    if(Keys.KeyD)s+=1;
    if(Keys.ArrowLeft){const a=Math.atan2(S.dy,S.dx)-2.2*dt;S.dx=Math.cos(a);S.dy=Math.sin(a);}
    if(Keys.ArrowRight){const a=Math.atan2(S.dy,S.dx)+2.2*dt;S.dx=Math.cos(a);S.dy=Math.sin(a);}
    if(S.wReverse>0)f=-f;
    const mdx=Input.dx*0.0021;
    if(mdx){const a=Math.atan2(S.dy,S.dx)+mdx;S.dx=Math.cos(a);S.dy=Math.sin(a);}
    const target=(f||s)?2.0:0;
    S.vel+=(target-S.vel)*Math.min(1,dt*5);
    if(S.vel<0.02&&!(f||s))S.vel=0;
    let vx=(S.dx*f-S.dy*s),vy=(S.dy*f+S.dx*s);
    const vl=Math.sqrt(vx*vx+vy*vy);
    if(vl>0){vx=vx/vl*S.vel*dt;vy=vy/vl*S.vel*dt;}
    else{vx=0;vy=0;}
    const r=0.22;
    if(!this.solidAt(S.px+vx+Math.sign(vx)*r,S.py)&&!this.solidAt(S.px+vx+Math.sign(vx)*r,S.py+(vx?r*0.7:0)))S.px+=vx;
    if(!this.solidAt(S.px,S.py+vy+Math.sign(vy)*r)&&!this.solidAt(S.px+(vy?r*0.7:0),S.py+vy+r))S.py+=vy;
    if(S.actNo===3){
      this.boundT-=dt;
      if(S.px<2.2||S.px>45.8||S.py<2.2||S.py>45.8){
        S.px=clamp(S.px,2.2,45.8);S.py=clamp(S.py,2.2,45.8);
        if(this.boundT<=0){this.boundT=25;Msg.say('the fl00r ends here. pr0bably.',3.2);}
      }
    }
    const moving=vl>0&&S.vel>0.3;
    if(moving){
      S.stepAcc+=S.vel*dt;
      S.bob=Math.sin(S.stepAcc*11)*1.4;
      if(S.stepAcc>0.62){S.stepAcc=0;Aud.step(1,rnd(-0.06,0.06));}
    }else S.bob*=0.9;
    if(S.lightOn&&S.charge>0&&!S.lightDead){
      S.charge=Math.max(0,S.charge-dt*0.55);
      if(S.charge===0){S.lightOn=false;Msg.say('light: [empty]',2.4,true);Aud.click();}
    }
    S.lightCur=S.lightOn&&S.charge>0?0.82+0.18*Math.sin(S.t*23)+rnd(-0.04,0.04):0;
  },
  interactScan(){
    S.nearEnt=null;
    if(S.pauseOpen||S.read||S.term)return;
    let best=null,bd=1.45;
    for(const e of this.ents){
      if(e.gone||e.hidden)continue;
      if(e.type!=='frag'&&e.type!=='switch'&&e.type!=='term')continue;
      const d=dist2(e.x,e.y,S.px,S.py);
      if(d<bd){
        const vx=(e.x-S.px)/d,vy=(e.y-S.py)/d;
        if(vx*S.dx+vy*S.dy>0.15){bd=d;best=e;}
      }
    }
    S.nearEnt=best;
    if(best&&Input.consume('KeyE')){
      if(best.type==='frag')UI.openRead(best);
      else if(best.type==='switch'){
        best.on=!best.on;
        const L=this.ents.find(l=>l.type==='lamp'&&l.ctl===best.id);
        if(L)L.on=best.on;
        Aud.click();
        if(best.id==='room1'&&!best.on&&!S.flags.room1solved){
          S.flags.room1solved=true;
          S.coh-=6;
          Msg.say('the room lets y0u g0.',3.2);
        }
        Save.write();
      }
      else if(best.type==='term')UI.openTerm();
    }
  },
  coherence(dt){
    const lit=this.lampLight(S.px,S.py,3.6);
    if(lit>0)S.coh+=dt*5.5*lit;
    else if(S.lightOn&&S.charge>0)S.coh-=dt*0.45;
    else S.coh-=dt*1.05;
    if(S.actNo===3&&S.lightDead)S.coh-=dt*0.35;
    S.coh=clamp(S.coh,0,100);
    S.wobble=S.coh<50?(1-S.coh/50)*2.2:0;
    if(S.coh<=0&&S.st!==ST.DEAD&&S.st!==ST.ENDING){die();return;}
    if(S.actNo>=2){
      S.cohLieT-=dt;
      if(S.cohLieT<=0){S.cohLieT=rnd(4,9);if(chance(0.3))S.cohFake=rnd(1,2.2);}
    }
    if(S.cohFake>0)S.cohFake-=dt;
    let sil=false;
    if(S.actNo===2&&S.px>1.6&&S.px<6.2&&S.py>20.6&&S.py<25.6){
      sil=true;
      if(!S.flags.silNote){S.flags.silNote=true;Msg.say('(it is t00 quiet here)',3,true);}
    }
    if(S.actNo===3&&S.py<13.6&&S.py>8.3)sil=true;
    if(sil!==S.silence){S.silence=sil;Aud.setSilence(sil);}
  },
  acts(dt){
    if(S.actNo===0){
      if(S.py<1.9&&!S.flags.proDone){S.flags.proDone=true;fadeGo(()=>goAct(1));}
      return;
    }
    if(S.actNo===1)this.act1();
    else if(S.actNo===2)this.act2(dt);
    else if(S.actNo===3)this.act3(dt);
  },
  act1(){
    if(S.py>6.4&&S.py<7.2&&S.px>6.9&&S.px<10.1&&!S.flags.room1solved&&S.flags.room1in){
      S.px=8.5;S.py=4.5;S.dx=0;S.dy=1;
      S.flags.room1loops=(S.flags.room1loops||0)+1;
      Aud.click();S.coh-=5;
      if(S.flags.room1loops===2)Msg.say('the room repeats.',3);
      if(S.flags.room1loops===4)Msg.say('the switch is f0r s0mething.',3.4);
      if(S.flags.room1loops>=6)Msg.say('st0p walking in circles, '+nm()+'.',3.4);
    }
    if(S.px>6.9&&S.px<10.1&&S.py>2.9&&S.py<6.6)S.flags.room1in=true;
    const door=this.ent('door','anom1');
    if(door&&!door.gone){
      const d=dist2(door.x,door.y,S.px,S.py);
      if(d<2.6)S.flags.door1seen=true;
      else if(S.flags.door1seen&&d>4.2&&!S.flags.door1armed)S.flags.door1armed=true;
      if(S.flags.door1armed&&d<2.6){
        S.flags.door1gone=true;door.gone=true;
        if(this.doorCell)this.g[this.doorCell.y][this.doorCell.x]='.';
        Aud.doorVanish();S.coh-=12;S.tear=0.5;
        Msg.say('there is no door here.',3.4);
        World.after(3,()=>Msg.say('there has never been one.',3.6));
        Meta.log('he saw the door. the door saw him. fixed.');
      }
    }
    if(!S.flags.gateOpen&&[1,2,3,4,5,6].every(id=>S.frags.indexOf(id)>=0)){
      S.flags.gateOpen=true;
      if(this.gate)this.gate.forEach(c=>this.g[c.y][c.x]='.');
      Aud.blip(300,600,0.06);
      Msg.say('the gate remembers y0u n0w.',3.4);
      World.after(3.2,()=>Msg.say('it is 0pen. it was always g0ing t0.',3.4));
      Save.write();
    }
    if(S.py<4.6&&S.px>8.9&&S.px<14.1&&S.flags.gateOpen&&!S.flags.act1end){
      S.flags.act1end=true;
      S.flash={kind:'sil',frames:2};
      Aud.whisper(0,1.4,2.2);
      Meta.title("d0n't l00k");
      World.after(1.6,()=>fadeGo(()=>goAct(2)));
    }
    if(S.quietHour&&!S.flags.q17&&S.frags.indexOf(17)<0){
      const q=this.ents.find(e=>e.type==='frag'&&e.id===17);
      if(!q){
        let qx=Math.floor(S.px+S.dx*3),qy=Math.floor(S.py+S.dy*3);
        if(this.solidAt(qx+0.5,qy+0.5)){qx=Math.floor(S.px);qy=Math.floor(S.py);}
        this.addFrag(qx,qy,17);
        const nq=this.ents.find(e=>e.type==='frag'&&e.id===17);
        nq.x=qx+0.5;nq.y=qy+0.5;
        this.ents.push({type:'walltext',x:qx+0.5-S.dx*0.55,y:qy+0.5-S.dy*0.55,txt:'the quiet h0ur'});
        Msg.say('s0mething appeared.',2.6,true);
      }
    }
  },
  act2(dt){
    if(!S.flags.obs2&&S.py<11.4&&S.px>12.4&&S.px<15.6){
      S.flags.obs2=true;
      Obs.spawn(13.5,7.5);
      Aud.whisper(0,1.2,2.6);
      Meta.log('he can see the console. do not let him read the code.',true);
    }
    if(S.py>19&&!S.flags.act2hello){S.flags.act2hello=true;Msg.say('the pr0gram is learning y0u.',3.6);}
    if(!S.flags.wRev&&S.frags.indexOf(9)>=0){
      S.flags.wRev=true;
      S.wReverse=10;
      World.after(10.5,()=>{
        Msg.say("s0rry. it w0n't happen again.",3);
        World.after(3,()=>Msg.say('i pr0mise.',1.4));
        World.after(4.4,()=>Msg.say('i pr0mise.',1.4));
        World.after(5.8,()=>Msg.say('i pr0mise.',2));
      });
    }
  },
  act3(dt){
    if(this.remnant.length){
      this.eraseAcc=(this.eraseAcc||0)+dt;
      if(this.eraseAcc>0.12){
        this.eraseAcc=0;
        for(let i=this.remnant.length-1;i>=0;i--){
          const c=this.remnant[i];
          if(c.y>S.py+4){
            this.g[c.y][c.x]='0';
            this.ghosts.push({x:c.x+0.5,y:c.y+0.5,ttl:0.7});
            this.remnant.splice(i,1);
            Aud.eraseTick();
            S.erased++;
            break;
          }
        }
      }
    }
    if(!S.lightDead&&S.py<36){
      S.lightDead=true;S.lightOn=false;S.charge=0;
      Aud.click();
      Msg.say('charge depleted.',3);
      World.after(2.6,()=>Msg.say('thank y0u for using light.',3.6));
      Save.write();
    }
    if(S.py<38){
      this.chT-=dt;
      if(this.chT<=0){
        this.chT=rnd(5,9);
        let best=null,bd=13;
        for(const e of this.ents)if(e.type==='frag'&&!e.gone){const d=dist2(e.x,e.y,S.px,S.py);if(d<bd){bd=d;best=e;}}
        if(best){
          const vx=best.x-S.px,vy=best.y-S.py,vl=Math.sqrt(vx*vx+vy*vy);
          const side=(vx*S.dy-vy*S.dx)/vl;
          Aud.chime(clamp(side,-1,1),0.05);
        }
      }
    }
    if(!S.flags.obs3&&S.py<22){
      S.flags.obs3=true;
      for(let dd=6;dd>=2.5;dd-=0.5){
        const ox=S.px+S.dx*dd,oy=S.py+S.dy*dd;
        if(!World.solidAt(ox,oy)&&ox>1.5&&ox<46&&oy>1.5&&oy<46){Obs.spawn(ox,oy,'stand');break;}
      }
      if(!Obs.active)S.flags.obs3=false;
    }
    if(!S.flags.coreMat&&S.py<9.6)this.materialize(false);
    if(!S.flags.act3hello&&S.py<38){S.flags.act3hello=true;
      Msg.say('they are rem0ving the rooms behind y0u.',3.6);
      World.after(3.8,()=>Msg.say("d0n't st0p walking.",3));
      Meta.ask('forget '+nm()+'?',()=>Msg.say('f0rg0tten. (n0t really.)',3),()=>Msg.say("kept. y0u can't unkeep a name.",3.4));
      Meta.log('deleting...',true);
    }
  },
  tabAnomaly(){
    const cands=this.ents.filter(e=>e.type==='frag'&&!e.gone&&S.frags.indexOf(e.id)<0);
    if(S.actNo===3&&cands.length&&chance(0.6)){
      const v=cands[rndi(0,cands.length-1)];
      v.gone=true;
      Msg.say('one fragment is g0ne.',3);
      World.after(3,()=>Msg.say('it was y0urs.',3));
      return;
    }
    if(cands.length&&chance(0.55)){
      const v=cands[rndi(0,cands.length-1)];
      for(let i=0;i<40;i++){
        const x=rndi(1,this.w-2),y=rndi(1,this.h-2);
        if(!this.solidAt(x+0.5,y+0.5)){v.x=x+0.5;v.y=y+0.5;break;}
      }
      Msg.say('it m0ved.',2.4,true);
      return;
    }
    const lampsOn=this.lamps.filter(l=>l.on);
    if(lampsOn.length>1){
      const L=lampsOn[rndi(0,lampsOn.length-1)];
      L.on=false;
      Msg.say('the light g0t tired.',2.6,true);
      return;
    }
    Msg.say('n0thing changed. pr0bably.',2.6,true);
  },
  spawnQuiet(){}
};

const Obs={
  x:0,y:0,active:false,hidden:false,dissolve:0,cool:0,mode:'hunt',
  spawn(x,y,mode){
    this.x=x;this.y=y;this.active=true;this.hidden=false;
    this.dissolve=0;this.cool=0;this.mode=mode||'hunt';
    Aud.whisper(0,0.9,2);
  },
  relocate(){
    this.active=false;this.dissolve=0;this.cool=rnd(16,34);this.mode='hunt';
  },
  isSeen(){
    const d=dist2(this.x,this.y,S.px,S.py);
    if(d>MAXD)return false;
    const vx=(this.x-S.px)/d,vy=(this.y-S.py)/d;
    if(vx*S.dx+vy*S.dy<0.55)return false;
    return World.los(S.px,S.py,this.x,this.y);
  },
  tick(dt){
    if(!this.active){
      if(this.cool>0)this.cool-=dt;
      if(this.cool<=0&&this.mode==='hunt'&&S.actNo===2&&inGame()&&!S.flags.act2done){
        for(let i=0;i<50;i++){
          const a=rnd(TAU),d=rnd(8,13);
          const x=S.px+Math.cos(a)*d,y=S.py+Math.sin(a)*d;
          if(!World.solidAt(x,y)&&!World.solidAt(x+0.3,y)&&!World.solidAt(x-0.3,y)){
            const vx=(x-S.px),vy=(y-S.py),vl=Math.sqrt(vx*vx+vy*vy);
            if(vx*S.dx+vy*S.dy<vl*0.3){this.x=x;this.y=y;this.active=true;this.hidden=false;this.dissolve=0;break;}
          }
        }
        if(this.active)this.cool=9999;
      }
      return;
    }
    const d=dist2(this.x,this.y,S.px,S.py);
    const seen=this.isSeen();
    if(seen){
      this.dissolve=clamp(this.dissolve+dt*0.1,0,1);
      if(this.dissolve>=1){
        Aud.whisper(rnd(-0.5,0.5),0.8,1.8);
        if(chance(0.35))Msg.say("d0n't.",2);
        this.relocate();
      }
    }else{
      this.dissolve=clamp(this.dissolve-dt*0.22,0,1);
      if(this.mode==='hunt'&&d>0.1){
        const sp=0.85*dt;
        const vx=(S.px-this.x)/d*sp,vy=(S.py-this.y)/d*sp;
        const blocked=(x,y)=>World.cellAt(Math.floor(x),Math.floor(y))==='#';
        let moved=false;
        if(!blocked(this.x+vx,this.y+vy)){this.x+=vx;this.y+=vy;moved=true;}
        else if(!blocked(this.x+vx,this.y)){this.x+=vx;moved=true;}
        else if(!blocked(this.x,this.y+vy)){this.y+=vy;moved=true;}
        if(!moved)this.relocate();
      }
    }
    if(d<6)S.coh-=dt*(6-d)*0.5;
    if(d<2&&this.mode==='hunt'){this.mode='wait';Ev.emit('obsNear');}
    if(this.mode==='stand'&&d<2.6){
      this.mode='wait';
      S.blackout=1;S.blackoutT=1.1;
      S.coh-=15;
      Msg.say('pl3ase. n0t yet.',3.2);
      Aud.whisper(0,1.3,2);
      this.relocate();
    }
  }
};

UI.openTerm=function(){

UI.termInput=function(code,ch){
  const t=S.term;if(!t)return;
  if(ch&&t.input.length<40)t.input+=ch;
  if(code==='Backspace')t.input=t.input.slice(0,-1);
  if(code==='Enter'){
    const cmd=t.input.trim().toLowerCase();
    t.out.push('> '+t.input);
    t.input='';
    Aud.blip(700,500,0.04);
    this.runCmd(cmd,t);
    if(t.out.length>10)t.out.splice(0,t.out.length-10);
  }
};
UI.runCmd=function(cmd,t){
  if(cmd==='')return;
  if(cmd==='help'){t.out.push('there is no help.');return;}
  if(cmd==='3x1t'||cmd==='exit'||cmd==='3x17'){t.out.push('removing c0re...');this.startEnding('exit');return;}
  if(cmd==='st4y'||cmd==='stay'){t.out.push('...');this.startEnding('stay');return;}
  if(cmd==='whoami'){
    const n16=S.frags.filter(i=>i<=16).length;
    if(n16>=16){t.out.push('y0u are '+nm()+'.');this.startEnding('n0thing');}
    else t.out.push('access denied. y0u are inc0mplete. ('+n16+'/16)');
    return;
  }
  t.out.push(corrupt('command n0t f0und. it was never here.',0.4));
};

UI.startEnding=function(kind){

UI.endingUpdate=function(dt){
  const e=S.end;if(!e)return;
  const t=S.t-e.t0;
  if(e.kind==='exit'){
    if(t>9.6&&!e.closeTried){e.closeTried=true;try{window.close();}catch(err){}}
    if(t>11.4&&!e.t2){e.t2=true;Meta.title('y0u are still h3re');}
    if(t>30&&!e.th){e.th=true;Aud.thump(0.3);Meta.title('still?');}
    if(t>34&&e.th&&!e.th2){e.th2=true;Meta.title('n0thing');}
  }else if(e.kind==='stay'){
    if(t>4&&!e.red){e.red=true;S.redacted=true;Aud.blip(900,200,0.07);Meta.title('g00dbye');}
    if(t>10&&!e.done){
      e.done=true;
      S.flags=S.flags||{};
      S.flags.ledger='subject 1: released. subject 2: \u2588\u2588\u2588\u2588\u2588\u2588';

      Save.write();
      S.endStay=true;S.st=ST.MENU;S.menu={idx:0,dodge:0};
      S.fade=1;S.fadeTo=0;S.fadeSpd=0.7;
    }
  }else if(e.kind==='n0thing'){
    if(t>10&&!e.room){e.room=true;Aud.endToRoomtone();Meta.title('n0thing');}

      S.flags=S.flags||{};

      if(Save.d){Save.d.flags=S.flags;}
      Save.write();

const Keys={},K1={};
const Input={
  dx:0, chars:'',
  init(){
    addEventListener('keydown',e=>{
      Meta.poke();
      if(e.key&&e.key.length===1)Input.chars+=e.key;
      if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace','Enter','KeyE','KeyF','KeyQ'].indexOf(e.code)>=0)e.preventDefault();
      Keys[e.code]=true;
      if(!e.repeat){
        K1[e.code]=true;
        UI.key(e.code);
        if(e.code==='ShiftLeft'||e.code==='ShiftRight')Ev.emit('shift');
        if(S.term)UI.termInput(e.code,(e.key&&e.key.length===1)?e.key:null);
      }
    });
    addEventListener('keyup',e=>{Keys[e.code]=false;});
    addEventListener('mousemove',e=>{
      Meta.poke();
      if(document.pointerLockElement===cv)Input.dx+=(e.movementX||0);
      const r=cv.getBoundingClientRect();
      if(r.width>0&&r.height>0){
        S.cursor.x=clamp((e.clientX-r.left)/r.width*W,0,W);
        S.cursor.y=clamp((e.clientY-r.top)/r.height*H,0,H);
      }
    });
    addEventListener('mousedown',()=>{Meta.poke();S.cursor.down=true;Aud.unlock();});
    addEventListener('mouseup',()=>{S.cursor.down=false;});
    addEventListener('click',()=>{UI.click();});
    cv.addEventListener('click',()=>{
      if(inGame()&&!S.pauseOpen&&!S.read&&!S.term&&document.pointerLockElement!==cv)Input.lock();
    });
    document.addEventListener('pointerlockchange',()=>{
      if(document.pointerLockElement!==cv&&inGame()&&!S.read&&!S.term&&S.overlayGrace<=0&&!S.pauseOpen)UI.openPause();
    });
    addEventListener('blur',()=>{for(const k in Keys)Keys[k]=false;});
  },
  lock(){try{if(cv.requestPointerLock)cv.requestPointerLock();}catch(e){}},
  consume(c){const v=K1[c];K1[c]=false;return v;},
  endFrame(){for(const k in K1)K1[k]=false;Input.dx=0;Input.chars='';}
};

function goAct(n,ck){
  S.actNo=n;
  World.build(n);
  const sp=World.spawn;
  if(ck){S.px=ck.x;S.py=ck.y;S.dx=ck.dx;S.dy=ck.dy;}
  else{S.px=sp.x;S.py=sp.y;S.dx=sp.dx;S.dy=sp.dy;}
  S.checkpoint={x:S.px,y:S.py,dx:S.dx,dy:S.dy};
  S.coh=Math.max(S.coh,60);
  if(n===1&&!ck){S.charge=100;S.lightDead=false;S.lightOn=false;}
  S.st=n===0?ST.PROLOGUE:(n===1?ST.ACT1:(n===2?ST.ACT2:ST.ACT3));
  S.card={t0:S.t,txt:['','act i — r00ms','act ii — err0rs','act iii — d3let10n'][n]||''};
  S.vel=0;S.wReverse=0;S.silence=false;Aud.setSilence(false);
  S.fade=1;S.fadeTo=0;S.fadeSpd=0.7;
  Obs.active=false;Obs.cool=8;Obs.mode='hunt';Aud.hbOn=true;
  Input.lock();
  Save.write();
}
function startNew(){
  S.frags=[];S.flags={};S.coh=85;S.charge=100;S.lightOn=false;S.lightDead=false;
  S.ending=null;S.redacted=false;S.stingers=0;S.confirmUsed=0;S.corruptAll=0;S.erased=0;
  S.deaths=(Save.d&&Save.d.deaths)||S.deaths||0;
  Save.d=null;
  goAct(0);
}
function doContinue(){
  const sd=Save.d;if(!sd)return;
  S.name=sd.name||'y0u';S.frags=sd.frags||[];S.flags=sd.flags||{};
  S.deaths=sd.deaths||0;S.subjects=sd.subjects||1;
  S.charge=(sd.charge!==undefined)?sd.charge:100;S.lightDead=!!sd.lightDead;
  S.ending=sd.ending||null;S.redacted=false;
  goAct(sd.act||1,sd.ck);
  Msg.say('resumed. welcome back, '+nm()+'.',3.2);
}

function update(dt){
  Meta.tick(dt);Meta.idle(dt);Msg.tick(dt);Aud.tick(dt);
  if(S.overlayGrace>0)S.overlayGrace-=dt;
  if(S.fade<S.fadeTo)S.fade=Math.min(S.fadeTo,S.fade+S.fadeSpd*dt);
  else if(S.fade>S.fadeTo)S.fade=Math.max(S.fadeTo,S.fade-S.fadeSpd*dt);
  if(S.pending&&S.fade>=0.98){const f=S.pending;S.pending=null;f();S.fadeTo=0;S.fadeSpd=0.7;}
  if(S.blackoutT>0)S.blackoutT-=dt;
  else if(S.blackout>0)S.blackout=Math.max(0,S.blackout-dt*2.2);
  if(S.corruptAll>0)S.corruptAll-=dt;
  if(S.tear>0)S.tear-=dt;
  if(S.wReverse>0)S.wReverse-=dt;
  switch(S.st){
    case ST.BOOT:UI.bootUpdate(dt);break;
    case ST.PROLOGUE:case ST.ACT1:case ST.ACT2:case ST.ACT3:
      World.update(dt);
      if(Input.consume('KeyF')){
        if(S.lightDead){Aud.click();if(!S.flags.lDeadNote){S.flags.lDeadNote=true;Msg.say('light: [d3ad]',2,true);}}
        else if(S.charge>0){S.lightOn=!S.lightOn;Aud.click();}
        else{Aud.click();Msg.say('light: [empty]',1.6,true);}
      }
      if(S.wReverse>0&&!S.flags.wSaid){S.flags.wSaid=true;Msg.say('w is n0t w0rking. s0rry.',3);}
      break;
    case ST.DEAD:S.deadT+=dt;if(S.deadT>4.4)respawn();break;
    case ST.ENDING:UI.endingUpdate(dt);break;
  }
}
function draw(){
  cx.setTransform(1,0,0,1,0,0);
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  if(inGame()){
    R.frame();
    UI.hud();
    Msg.draw();
    UI.cardDraw();
  }
  if(S.st===ST.WARNING)UI.warning();
  else if(S.st===ST.BOOT)UI.bootDraw();
  else if(S.st===ST.MENU)UI.menuDraw();
  else if(S.st===ST.DEAD)UI.deadDraw();
  else if(S.st===ST.ENDING)UI.endingDraw();
  if(S.read)UI.drawRead();
  if(S.term)UI.drawTerm();
  if(S.updateUI&&S.t>=S.updateUI.t0)UI.updateDraw();
  if(S.pauseOpen)UI.pauseDraw();
  if(S.fade>0.003){cx.fillStyle='rgba(0,0,0,'+S.fade.toFixed(3)+')';cx.fillRect(0,0,W,H);}
  if(S.blackout>0){cx.globalAlpha=clamp(S.blackout,0,1);cx.fillStyle='#000';cx.fillRect(0,0,W,H);cx.globalAlpha=1;}
  if(S.st===ST.WARNING||S.st===ST.BOOT||S.st===ST.MENU||S.pauseOpen)UI.cursor();
}

let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,Math.max(0,(now-lastT)/1000));
  lastT=now;
  S.dt=dt;S.t+=dt;S.idleT+=dt;
  update(dt);
  draw();
  Input.endFrame();
}
function resize(){
  const s=Math.max(1,Math.min(window.innerWidth/W,window.innerHeight/H));
  const si=s>=1?Math.floor(s):s;
  cv.style.width=(W*si)+'px';cv.style.height=(H*si)+'px';
}
(function init(){
  R.init();World.init();Meta.init();Input.init();
  Save.d=Save.load();
  addEventListener('resize',resize);resize();
  document.title='there is n0thing h3re';
  S.tabLeftAt=Date.now();
  requestAnimationFrame(loop);
  Meta.log('PST-0 // EMPTY.EXE loaded. nothing is here.');
})();
</script>
